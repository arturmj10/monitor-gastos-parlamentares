services:
  postgres:
    image: postgres:16
    container_name: coleta-postgres
    environment:
      POSTGRES_USER: coleta
      POSTGRES_PASSWORD: coleta
      POSTGRES_DB: coleta
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coleta"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
