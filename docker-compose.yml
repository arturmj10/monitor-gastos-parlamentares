services:
  postgres:
    image: postgres:16
    container_name: coleta-postgres
    environment:
      POSTGRES_USER: coleta
      POSTGRES_PASSWORD: coleta
      POSTGRES_DB: coleta
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coleta"]
      interval: 5s
      timeout: 3s
      retries: 10

  coleta:
    build: .
    container_name: coleta-service
    environment:
      PORT: "8080"
      LOG_LEVEL: info
      DATABASE_URL: postgres://coleta:coleta@postgres:5432/coleta?sslmode=disable
      CAMARA_BASE_URL: https://dadosabertos.camara.leg.br/api/v2
      CAMARA_TIMEOUT: 10s
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
